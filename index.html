<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Sala Giochi dei Nipoti</title>
  <meta name="description" content="Giochi semplici per bambini da fare sul telefono: frutta da tagliare, memory, corse e indovinelli.">
  <meta name="theme-color" content="#2a1458">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- MENU -->
  <section id="menu" class="screen active">
    <header class="menu-head">
      <h1>🎮 Sala Giochi <span>dei Nipoti</span></h1>
      <button id="sound-btn" class="icon-btn" aria-label="Audio">🔊</button>
    </header>

    <div class="player-box">
      <label for="player">👋 Chi gioca?</label>
      <input id="player" maxlength="12" placeholder="Scrivi il tuo nome" autocomplete="off" enterkeyhint="done">
      <div id="player-chips" class="chips"></div>
    </div>

    <div id="game-list" class="game-list"></div>

    <footer class="foot">Fatto con ❤️ per i nipoti · I record restano salvati su questo telefono</footer>
  </section>

  <!-- GIOCO -->
  <section id="game" class="screen">
    <div class="hud">
      <button id="back" class="icon-btn" aria-label="Torna al menu">⬅</button>
      <div class="hud-info" id="hud-info"></div>
      <div class="hud-box">⭐ <b id="hud-points">0</b></div>
      <div class="hud-box">⏱ <b id="hud-time">0:00</b></div>
    </div>
    <div id="stage" class="stage"></div>
    <div id="end" class="end"></div>
  </section>

  <script src="js/chars.js"></script>
  <script src="js/core.js"></script>
  <script src="js/games/fruit.js"></script>
  <script src="js/games/memory.js"></script>
  <script src="js/games/runner.js"></script>
  <script src="js/games/simon.js"></script>
  <script src="js/games/whack.js"></script>
  <script src="js/games/quiz.js"></script>
  <script src="js/games/find.js"></script>
  <script>App.init();</script>
</body>
</html>
